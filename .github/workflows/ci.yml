name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    name: "gates (py${{ matrix.python-version }}) - full if cross-repo token, else single-repo defect-regression lint"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout qicangaeon
        uses: actions/checkout@v4

      - name: "Checkout holoaeon (25 mechanisms, public)"
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: weideyouni/holoaeon
          path: holoaeon

      - name: "Checkout netaeon (19 nodes, private - needs QC_DEPS_TOKEN)"
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: weideyouni/netaeon
          path: netaeon
          token: ${{ secrets.QC_DEPS_TOKEN || github.token }}

      - name: "Checkout mirraeon (six-step routing, private - needs QC_DEPS_TOKEN)"
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: weideyouni/mirraeon
          path: mirraeon
          token: ${{ secrets.QC_DEPS_TOKEN || github.token }}

      - name: Dependency presence probe
        id: deps
        run: |
          mode=full
          for d in holoaeon netaeon mirraeon; do
            n=$(find "$d" -mindepth 1 -maxdepth 1 -not -name .git 2>/dev/null | wc -l)
            if [ "${n:-0}" -gt 0 ]; then
              echo "$d: present ($n entries)"
            else
              echo "$d: ABSENT or EMPTY (failed private-repo checkout leaves only .git; needs QC_DEPS_TOKEN secret)"
              mode=degraded
              rm -rf "$d" 2>/dev/null || true
            fi
          done
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "degraded" ]; then
            echo "::warning title=CI degraded::cross-repo deps unreachable -> running single-repo defect-regression lint only; full integration gates NOT run"
          else
            echo "::notice title=CI full::all deps present -> full batch gates + unit tests"
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Full batch gates (35/35 expected)"
        if: steps.deps.outputs.mode == 'full'
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/holoaeon:${{ github.workspace }}/netaeon:${{ github.workspace }}/mirraeon
        run: |
          cd "$GITHUB_WORKSPACE"
          python -m qicangaeon.qc_ledger batch

      - name: "Full unit tests (44 expected)"
        if: steps.deps.outputs.mode == 'full'
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/holoaeon:${{ github.workspace }}/netaeon:${{ github.workspace }}/mirraeon
        run: |
          cd "$GITHUB_WORKSPACE"
          python -m unittest discover -s tests -v

      - name: "Single-repo defect-regression lint (degraded mode, no cross-repo import)"
        if: steps.deps.outputs.mode != 'full'
        run: |
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          import io, re, sys
          fails = []
          readme = io.open("README.md", encoding="utf-8").read()
          if "Ran 24 tests" in readme:
              fails.append("DF-003: README still claims 'Ran 24 tests'")
          if "即 FAIL）。" in readme:
              fails.append("DF-003: README residual sentence still present")
          if "35" not in readme:
              fails.append("DF-003: README lacks the 35-count reconciliation")
          core = io.open("qicangaeon/qc_core.py", encoding="utf-8").read()
          if re.search(r"or\s+True", core):
              fails.append("DF-001: qc_core still contains tautological 'or True'")
          ledger = io.open("qicangaeon/qc_ledger.py", encoding="utf-8").read()
          if len(set(re.findall(r"DF-00[1-4]", ledger))) < 4:
              fails.append("DF-002: DEFECT_LEDGER entries < 4")
          ci = io.open(".github/workflows/ci.yml", encoding="utf-8").read()
          for repo in ("holoaeon", "netaeon", "mirraeon", "qicangaeon"):
              if repo not in ci:
                  fails.append("DF-004: ci.yml missing " + repo)
          print("defect-regression lint: " + ("PASS" if not fails else "FAIL"))
          for f in fails:
              print(" - " + f)
          sys.exit(1 if fails else 0)
          PY